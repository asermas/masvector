<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- MasVector: PDF'te gömülü olmayan fontlar için Windows sistem fontları -->
<fontconfig>
  <dir>WINDOWSFONTDIR</dir>
  <dir>WINDOWSUSERFONTDIR</dir>
  <cachedir>LOCAL_APPDATA_FONTCONFIG_CACHE</cachedir>
  <alias><family>serif</family><prefer><family>Times New Roman</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>Arial</family></prefer></alias>
  <alias><family>monospace</family><prefer><family>Courier New</family></prefer></alias>
</fontconfig>
