<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self'" />
  <title>MasVector</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="logo"></span>MasVector</div>
    <div id="doc-title" class="doc-title" title="Belge"></div>
    <select id="frame-select" class="frame-select" title="Gösterilen frame" hidden></select>
    <div class="spacer"></div>
    <div class="group">
      <button data-cmd="undo" title="Geri al (Ctrl+Z)">↶</button>
      <button data-cmd="redo" title="Yinele (Ctrl+Shift+Z)">↷</button>
    </div>
    <div class="group zoom">
      <button data-cmd="zoom-out" title="Uzaklaş (−)">−</button>
      <span id="zoom-label">100%</span>
      <button data-cmd="zoom-in" title="Yakınlaş (+)">+</button>
      <button data-cmd="fit" title="Sığdır (Ctrl+0)">⤢</button>
    </div>
    <div class="group">
      <button data-cmd="vectorize" class="primary" title="PDF veya görseli (PNG/JPEG/WebP…) profesyonel vektöre çevir">Vektörleştir…</button>
      <input id="vec-file" type="file" accept=".pdf,application/pdf,image/png,image/jpeg,image/webp,image/gif,image/bmp,image/tiff" hidden />
    </div>
    <div class="group">
      <button data-cmd="export-svg">SVG</button>
      <button data-cmd="export-png">PNG</button>
      <button data-cmd="export-pdf">PDF</button>
      <button data-cmd="save" title="Kaydet (Ctrl+S)">Kaydet</button>
    </div>
  </header>

  <nav id="toolbar" aria-label="Araçlar">
    <button data-tool="select" title="Seç (V)" class="active"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-6 1.5L10 20z"/></svg></button>
    <button data-tool="direct" title="Doğrudan seç / nokta düzenle (A)"><svg viewBox="0 0 24 24"><path d="M5 3l14 9-6 1.5L10 20z" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button data-tool="hand" title="El (H / Boşluk)"><svg viewBox="0 0 24 24"><path d="M8 11V5.5a1.5 1.5 0 013 0V10m0-4.5v-1a1.5 1.5 0 013 0V10m0-3.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-1a6 6 0 01-5-2.7L3.5 13a1.5 1.5 0 012.4-1.8L8 13.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <hr />
    <button data-tool="rect" title="Dikdörtgen (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button data-tool="ellipse" title="Elips (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8" ry="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
    <button data-tool="line" title="Çizgi (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button data-tool="pen" title="Kalem — tıkla: köşe, sürükle: eğri, Enter: bitir (P)"><svg viewBox="0 0 24 24"><path d="M12 3l5 9-5 9-5-9z M12 12v0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="12" r="1.6"/></svg></button>
    <button data-tool="text" title="Metin (T)"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  </nav>

  <main id="stage">
    <canvas id="canvas"></canvas>
    <div id="hint" class="hint"></div>
    <div id="toast" class="toast" role="status"></div>
    <input id="text-input" class="text-input" type="text" placeholder="Metin yazın, Enter" hidden />
    <div id="offline" class="offline" hidden>Document Server'a bağlanılamıyor — yeniden deneniyor…</div>
  </main>

  <aside id="sidebar">
    <section class="panel" id="props-panel">
      <h2>Özellikler</h2>
      <div id="props"></div>
    </section>
    <section class="panel grow" id="layers-panel">
      <h2>Katmanlar <button id="add-layer" class="mini" title="Yeni katman">＋</button></h2>
      <div id="layers" class="tree"></div>
    </section>
    <section class="panel" id="activity-panel">
      <h2>Ajant etkinliği <span id="lock-badge" class="badge" hidden></span></h2>
      <ol id="activity"></ol>
    </section>
  </aside>

  <footer id="statusbar">
    <span id="conn" class="dot"></span><span id="conn-label">bağlanıyor</span>
    <span class="sep"></span><span id="version">v–</span>
    <span class="sep"></span><span id="cursor">x – y –</span>
    <span class="sep"></span><span id="sel-info">seçim yok</span>
    <span class="spacer"></span><span id="server-url"></span>
  </footer>
  <script src="renderer.js"></script>
</body>
</html>
